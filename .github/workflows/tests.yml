name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4   # test_market.py runs the Market page's code in Node
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: uv run --locked pytest -q
        env:
          REQUIRE_NODE: "1"   # a missing Node fails the Market test instead of skipping it
