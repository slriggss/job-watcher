<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch Jobber – Market</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5e1f2b">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<main>
  <h1>Market</h1>
  <p class="muted" id="intro">Loading…</p>
  <section class="market"><h2 id="h1"></h2><div class="key" id="k1"></div><div class="chart-card" id="c1"><div class="skel chart-skel"></div></div><div class="chart-card" id="c1b" hidden></div><p id="p1"></p></section>
  <section class="market"><h2 id="h2"></h2><div class="key" id="k2"></div><div class="chart-card" id="c2" data-tone="gone"><div class="skel chart-skel"></div></div><p id="p2"></p></section>
  <section class="market"><h2 id="h3"></h2><div class="key" id="k3"></div><div class="chart-card" id="c3"><div class="skel chart-skel"></div></div><p id="p3"></p></section>
  <section class="market"><h2 id="h4"></h2><div class="key" id="k4"></div><div class="chart-card" id="c4" data-tone="gone"><div class="skel chart-skel"></div></div><p id="p4"></p></section>
  <section class="market"><h2 id="h5"></h2><div class="key" id="k5"></div><div class="chart-card" id="c5"><div class="skel chart-skel"></div></div><p id="p5"></p></section>
  <section class="market"><h2 id="h6"></h2><div class="key" id="k6"></div><div class="chart-card" id="c6"><div class="skel chart-skel"></div></div><p id="p6"></p></section>
</main>
<script src="app.js?v=11"></script>
<script src="charts.js?v=11"></script>
<script src="market.js?v=11"></script>
<script>
renderNav("market.html");
const sum = a => a.reduce((x, y) => x + y, 0);
const set = (n, h, p) => { $("#h" + n).textContent = h; $("#p" + n).textContent = p; };
const key = (n, big, unit) => { $("#k" + n).innerHTML = `<span class="big">${esc(big)}</span><span class="unit">${esc(unit)}</span>`; };
const none = n => { $("#c" + n).innerHTML = `<p class="empty">Not enough history yet. This fills in as daily runs accumulate.</p>`; };

loadData().then(({ rows, latest }) => {
  const m = computeMarket(rows, latest), nd = m.days.length;
  // The first day cannot have new or removed postings by definition (nothing was seen before it), so those
  // charts and averages start on the second day.
  const days2 = m.days.slice(1), newAll2 = m.newAll.slice(1), newRole2 = m.newRole.slice(1), removed2 = m.removed.slice(1);
  $("#intro").textContent = `Computed in your browser from data/history.csv: ${rows.length.toLocaleString()} postings, history through ${shortDate(latest)}. Postings already open on a source's first day (first_run) have an unknown start date and are left out of the start-date measures.`;

  const totNew = sum(newAll2), totRole = sum(newRole2);
  set(1, `${totNew.toLocaleString()} new postings so far, ${totRole.toLocaleString()} in my role`,
    `Each point counts postings first seen on that day, leaving out first-run postings. "In my role" uses the title rule in the README (ESG, sustainability, stewardship and related titles) and has its own scale, since it is a small fraction of all new postings. ${days2.length < 2 ? "Fewer than two days can show new postings so far." : `The first day is the baseline and is not counted, so the average is over the ${days2.length} days that can have new postings.`}`);
  key(1, days2.length ? (totNew / days2.length).toFixed(1) : "–", "new postings a day on average");
  if (days2.length >= 2) {
    $("#c1").innerHTML = ""; lineChart($("#c1"), days2, [{ name: "All postings", values: newAll2 }]);
    const roleCard = $("#c1b"); roleCard.hidden = false; roleCard.style.marginTop = "12px";
    lineChart(roleCard, days2, [{ name: "In my role", values: newRole2, color: "var(--good)" }]);
  } else none(1);

  const totGone = sum(removed2);
  set(2, `${totGone.toLocaleString()} postings removed so far`,
    `A posting is removed on the first day its source has a raw file and no longer lists it. Removals are counted by removed date and include first-run postings, because the removal date is known even when the start date is not.`);
  key(2, totGone.toLocaleString(), "removed since watching began");
  if (days2.length >= 2) { $("#c2").innerHTML = ""; barChart($("#c2"), days2, removed2, "removed"); } else none(2);

  const top = m.perEmployer.slice(0, 20);
  set(3, `${top.length ? top[0][0] : "No employer"} has the most open postings`,
    `${m.openCount.toLocaleString()} postings are open across ${m.perEmployer.length} employers as of the last run. The chart shows the largest ${top.length}.`);
  key(3, top.length ? top[0][1].toLocaleString() : "–", "open postings at the largest employer");
  if (top.length) { $("#c3").innerHTML = ""; hBarChart($("#c3"), top.map(e => e[0]), top.map(e => e[1]), "open", m.openCount); } else none(3);

  set(4, m.medianDaysOpen === null ? "Median days open: not known yet" : "How long postings stay open",
    `Days open is the removed date minus the first-seen date, for removed postings that are not first-run. ${m.removedCount.toLocaleString()} postings qualify so far. Postings still open are not counted, so early figures lean short.`);
  if (m.removedCount) {
    const buckets = new Map();
    for (const r of rows) if (!r.first_run && r.status === "removed" && r.removed_date) {
      const d = daysBetween(r.first_seen, r.removed_date); buckets.set(d, (buckets.get(d) || 0) + 1);
    }
    const lo = buckets.get(0) ? 0 : 1, maxD = Math.max(...buckets.keys());  // no empty "0" slot
    const labs = Array.from({ length: maxD - lo + 1 }, (_, i) => String(i + lo));
    key(4, `${m.medianDaysOpen} day${m.medianDaysOpen === 1 ? "" : "s"}`, "median time a removed posting was open");
    $("#c4").innerHTML = "";
    barChart($("#c4"), labs, labs.map(l => buckets.get(+l) || 0), "postings", undefined,
      { mark: { at: m.medianDaysOpen - lo, label: `median ${m.medianDaysOpen}` } });
  } else { key(4, "–", "median time a removed posting was open"); none(4); }

  set(5, m.shareWithin7 === null ? "Share removed within 7 days: not known yet" : "How many postings go within a week",
    `Among postings that are not first-run and were first seen at least seven days before the last run (${m.eligibleCount.toLocaleString()} so far), ${m.quickCount.toLocaleString()} had a removed date seven days or fewer after first seen.`);
  if (m.shareWithin7 !== null) {
    key(5, `${(m.shareWithin7 * 100).toFixed(1)}%`, "removed within seven days of first being seen");
    splitBar($("#c5"), [{ label: "Removed within 7 days", value: m.quickCount }, { label: "Not removed within 7 days", value: m.eligibleCount - m.quickCount }]);
  } else { key(5, "–", "removed within seven days of first being seen"); none(5); }

  const loc = m.perLocation.slice(0, 15), placed = m.openCount - m.unplacedCount;
  set(6, loc.length ? `${loc[0][0]} is the top location among open postings` : "No locations yet",
    `Open postings by place. Different spellings of one place (such as "New York, NY" and "New York, New York, United States of America") are combined, and a posting with several locations counts once, under its first. ${m.unplacedCount.toLocaleString()} of ${m.openCount.toLocaleString()} open postings (${(100 * m.unplacedCount / Math.max(1, m.openCount)).toFixed(1)}%) list only "N Locations" and are not placed until their full location list has been read. The chart shows the top ${loc.length}.`);
  key(6, loc.length ? loc[0][1].toLocaleString() : "–", "open postings in the top place");
  if (loc.length) { $("#c6").innerHTML = ""; hBarChart($("#c6"), loc.map(l => l[0]), loc.map(l => l[1]), "open", placed); } else none(6);
}).catch(showError);
</script>
</body>
</html>
