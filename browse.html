<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Watcher – Browse</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6f50">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Browse open postings</h1>
  <div class="switch" id="scope">
    <button data-v="role" class="on">In my role</button><button data-v="all">All postings</button>
  </div>
  <div class="controls">
    <label>Search titles<input id="q" type="search" placeholder="e.g. sustainability"></label>
    <label>Employer<select id="employer"><option value="">All employers</option></select></label>
    <label>Location contains<input id="loc" type="search" placeholder="e.g. New York"></label>
    <label>Days open<select id="days">
      <option value="">Any</option><option value="7">7 days or fewer</option>
      <option value="30">30 days or fewer</option><option value="90">90 days or fewer</option></select></label>
    <label>Sort by first seen<select id="sort"><option value="desc">Newest first</option><option value="asc">Oldest first</option></select></label>
    <label>Shortlist<select id="short"><option value="">All</option><option value="1">Starred only</option></select></label>
  </div>
  <p class="muted" id="count"></p>
  <ul class="posts" id="list"></ul>
  <p><button id="more" hidden>Show more</button></p>
</main>
<script src="app.js"></script>
<script>
renderNav("browse.html");
const KEY = "jobwatcher.shortlist";
let shortlist = new Set();
try { shortlist = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...shortlist])); } catch (e) {} };
let openRows = [], scope = "role", limit = 100;

function view() {
  const q = $("#q").value.trim().toLowerCase(), loc = $("#loc").value.trim().toLowerCase();
  const emp = $("#employer").value, maxDays = +$("#days").value, onlyStar = $("#short").value === "1";
  const out = openRows.filter(r =>
    (scope === "all" || r.in_role) && (!emp || r.employer === emp) &&
    (!loc || r.location.toLowerCase().includes(loc)) && (!q || r.title.toLowerCase().includes(q)) &&
    (!maxDays || r.daysOpen <= maxDays) && (!onlyStar || shortlist.has(r.posting_id)));
  const dir = $("#sort").value === "asc" ? 1 : -1;
  out.sort((a, b) => dir * a.first_seen.localeCompare(b.first_seen) || a.posting_id.localeCompare(b.posting_id));
  $("#count").textContent = `${out.length.toLocaleString()} postings`;
  $("#list").innerHTML = out.slice(0, limit).map(r => `<li>
    <button class="star ${shortlist.has(r.posting_id) ? "on" : ""}" data-id="${esc(r.posting_id)}" aria-label="Save to shortlist" title="Save to shortlist">${shortlist.has(r.posting_id) ? "★" : "☆"}</button>
    <div class="main"><div class="t">${esc(r.title)}${r.in_role ? '<span class="tag">in role</span>' : ""}</div>
      <div class="m">${esc(r.employer)}${r.location ? " · " + esc(r.location) : ""} · first seen ${r.first_seen}${r.first_run ? " or earlier" : ""} · ${r.daysOpen} day${r.daysOpen === 1 ? "" : "s"} open${r.first_run ? "+" : ""}</div></div>
    <a class="apply" href="${esc(r.url)}" target="_blank" rel="noopener">Apply</a></li>`).join("") ||
    `<li class="empty">No postings match.</li>`;
  $("#more").hidden = out.length <= limit;
}

loadData().then(({ rows, latest }) => {
  openRows = rows.filter(r => r.status === "open").map(r => ({ ...r, daysOpen: daysBetween(r.first_seen, latest) }));
  const emps = [...new Set(openRows.map(r => r.employer))].sort();
  $("#employer").insertAdjacentHTML("beforeend", emps.map(e => `<option>${esc(e)}</option>`).join(""));
  view();
}).catch(showError);

for (const id of ["q", "loc", "employer", "days", "sort", "short"]) $("#" + id).addEventListener("input", () => { limit = 100; view(); });
$("#scope").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  scope = b.dataset.v; limit = 100;
  document.querySelectorAll("#scope button").forEach(x => x.classList.toggle("on", x === b)); view();
});
$("#more").addEventListener("click", () => { limit += 200; view(); });
$("#list").addEventListener("click", e => {
  const b = e.target.closest(".star"); if (!b) return;
  const id = b.dataset.id;
  shortlist.has(id) ? shortlist.delete(id) : shortlist.add(id);
  save(); view();
});
</script>
</body>
</html>
