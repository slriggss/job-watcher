<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch Jobber – Browse</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7a2f3a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#5e1f2b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<main id="main">
  <h1>Browse open postings</h1>
  <div class="switch" id="scope" role="group" aria-label="Which postings">
    <button type="button" data-v="role" class="on" aria-pressed="true">In my role</button><button type="button" data-v="am" aria-pressed="false">Asset-manager ESG</button><button type="button" data-v="all" aria-pressed="false">All postings</button><button type="button" data-v="short" aria-pressed="false">Shortlist (0)</button>
  </div>
  <div class="controls" id="controls">
    <label>Search titles<input id="q" type="search" placeholder="e.g. esg analyst"></label>
    <label>Employer type<select id="etype"><option value="">All types</option></select></label>
    <label>Employer<select id="employer"><option value="">All employers</option></select></label>
    <label>Location contains<input id="loc" type="search" placeholder="e.g. New York"></label>
    <label>Days open<select id="days"><option value="">Any</option></select></label>
    <label>Sort by first seen<select id="sort"><option value="desc">Newest first</option><option value="asc">Oldest first</option></select></label>
  </div>
  <p class="muted"><span id="count" aria-live="polite"></span> <button type="button" id="clear" class="linklike" hidden>Clear filters</button></p>
  <p id="toast" class="toast" role="status" hidden></p>
  <ul class="posts" id="list"><li class="skel row-skel"></li><li class="skel row-skel"></li><li class="skel row-skel"></li><li class="skel row-skel"></li></ul>
  <p><button type="button" id="more" hidden>Show more</button></p>
</main>
<script src="app.js?v=7"></script>
<script src="browse.js?v=7"></script>
</body>
</html>
